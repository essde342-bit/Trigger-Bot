plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

def galahadSource = file("src/main/resources/assets/triggerbot/fonts/GalahadStd Regular.otf")
def galahadTarget = file("${buildDir}/generated-resources/assets/triggerbot/font/galahad_regular.ttf")

tasks.register("prepareGalahadFont", Exec) {
    inputs.file(galahadSource)
    outputs.file(galahadTarget)

    doFirst {
        def os = System.getProperty("os.name").toLowerCase(Locale.ROOT)
        def python = os.contains("win") ? "py" : "python3"
        commandLine python,
                "scripts/convert_galahad_otf.py",
                galahadSource.absolutePath,
                galahadTarget.absolutePath
    }
}

processResources {
    dependsOn(tasks.named("prepareGalahadFont"))
    from(galahadTarget) {
        into("assets/triggerbot/font")
    }
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") {
        expand("version": project.version)
    }
}

dependencies {
    minecraft "com.mojang:minecraft:" + project.minecraft_version
    mappings "net.fabricmc:yarn:" + project.yarn_mappings + ":v2"
    modImplementation "net.fabricmc:fabric-loader:" + project.loader_version
    modImplementation "net.fabricmc.fabric-api:fabric-api:" + project.fabric_version

    compileOnly "org.projectlombok:lombok:1.18.36"
    annotationProcessor "org.projectlombok:lombok:1.18.36"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "LICENSE_" + archivesBaseName }
    }
}
