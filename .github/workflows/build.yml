name: Build Astra Client
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check fonttools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle build --no-daemon
      - name: Verify custom-only fonts and sharp GUI resources
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          echo "Checking $JAR"

          jar tf "$JAR" | grep -Fx 'kronex/fun/display/screens/clickgui/MenuScreen.class'
          jar tf "$JAR" | grep -Fx 'assets/triggerbot/font/pt_sans.json'
          jar tf "$JAR" | grep -Fx 'assets/triggerbot/font/PTSans-Regular.ttf'
          jar tf "$JAR" | grep -Fx 'assets/triggerbot/font/galahad.json'
          jar tf "$JAR" | grep -Fx 'assets/triggerbot/font/galahad_regular.ttf'

          python - <<'PY'
          import json
          from pathlib import Path
          from fontTools.ttLib import TTFont

          assets = Path("build/resources/main/assets/triggerbot/font")
          expected = {
              "pt_sans.json": ("PTSans-Regular.ttf", "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя0123456789"),
              "galahad.json": ("galahad_regular.ttf", "ASTRA"),
          }

          for config_name, (font_name, required_text) in expected.items():
              config = json.loads((assets / config_name).read_text(encoding="utf-8"))
              providers = config.get("providers", [])
              assert len(providers) == 1, (
                  f"{config_name}: expected exactly one provider; Minecraft fallback is forbidden"
              )
              provider = providers[0]
              assert provider.get("type") == "ttf", (
                  f"{config_name}: custom TTF provider must be the only provider"
              )
              assert provider.get("file", "").endswith(font_name), (
                  f"{config_name}: incorrect custom font file"
              )
              assert provider.get("oversample", 1) == 1, (
                  f"{config_name}: oversample must stay at 1 for crisp rendering"
              )

              font_path = assets / font_name
              font = TTFont(str(font_path), recalcBBoxes=False, recalcTimestamp=False)
              cmap = font.getBestCmap()
              assert cmap, f"{font_name}: empty character map"
              missing = sorted({ch for ch in required_text if ord(ch) not in cmap})
              assert not missing, (
                  f"{font_name}: required custom-font glyphs missing: {''.join(missing)}"
              )
              assert font.sfntVersion == "\\x00\\x01\\x00\\x00", (
                  f"{font_name}: invalid TrueType font"
              )
              print(f"{font_name}: {len(cmap)} mapped characters; all required glyphs found")

          galahad = TTFont(
              str(assets / "galahad_regular.ttf"),
              recalcBBoxes=False,
              recalcTimestamp=False,
          )
          assert "glyf" in galahad
          assert "CFF " not in galahad and "CFF2" not in galahad
          print("Galahad TrueType outline validation passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Astra-Client-1.2.1
          path: build/libs/*.jar
