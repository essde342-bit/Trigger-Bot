name: Build Astra Client
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --disable-pip-version-check fonttools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle build --no-daemon
      - name: Verify Kotlin menu and both custom fonts
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          echo "Checking $JAR"

          jar tf "$JAR" | grep -Fx 'kronex/fun/display/screens/clickgui/MenuScreen.class'
          jar tf "$JAR" | grep -Fx 'assets/triggerbot/font/pt_sans.json'
          jar tf "$JAR" | grep -Fx 'assets/triggerbot/font/PTSans-Regular.ttf'
          jar tf "$JAR" | grep -Fx 'assets/triggerbot/font/galahad.json'
          jar tf "$JAR" | grep -Fx 'assets/triggerbot/font/galahad_regular.ttf'

          python - <<'PY'
          import json
          from pathlib import Path
          from fontTools.ttLib import TTFont

          assets = Path("build/resources/main/assets/triggerbot/font")
          required_fallbacks = {
              "minecraft:include/space",
              "minecraft:include/default",
              "minecraft:include/unifont",
          }

          for config_name, font_name in (
              ("pt_sans.json", "PTSans-Regular.ttf"),
              ("galahad.json", "galahad_regular.ttf"),
          ):
              config = json.loads((assets / config_name).read_text(encoding="utf-8"))
              providers = config.get("providers", [])
              assert providers and providers[0].get("type") == "ttf", (
                  f"{config_name}: custom TTF provider must remain first"
              )
              references = {
                  provider.get("id")
                  for provider in providers
                  if provider.get("type") == "reference"
              }
              assert required_fallbacks <= references, (
                  f"{config_name}: missing vanilla fallback providers"
              )

              font_path = assets / font_name
              font = TTFont(str(font_path), recalcBBoxes=False, recalcTimestamp=False)
              cmap = font.getBestCmap()
              assert cmap, f"{font_name}: empty character map"
              assert font.sfntVersion == bytes.fromhex("00010000").decode("latin-1"), (
                  f"{font_name}: invalid TrueType font"
              )
              print(f"{font_name}: {len(cmap)} mapped characters; fallback configured")

          galahad = TTFont(
              str(assets / "galahad_regular.ttf"),
              recalcBBoxes=False,
              recalcTimestamp=False,
          )
          assert "glyf" in galahad
          assert "CFF " not in galahad and "CFF2" not in galahad
          print("Galahad TrueType outline validation passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Astra-Client-1.2.1
          path: build/libs/*.jar
