name: Import ClickGUI archive

on:
  push:
    branches:
      - port/minecraft-1.21.4

permissions:
  contents: write

jobs:
  import-clickgui:
    if: github.event.head_commit.message != 'Import complete ClickGUI archive [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/minecraft-1.21.4
          fetch-depth: 1

      - name: Reassemble archive
        shell: bash
        run: |
          set -euo pipefail
          cat .clickgui-port/part-* > /tmp/clickgui.rar.b64
          base64 -d /tmp/clickgui.rar.b64 > /tmp/clickgui.rar
          7z t /tmp/clickgui.rar >/dev/null

      - name: Extract and import all archived files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/clickgui-extract
          mkdir -p /tmp/clickgui-extract
          7z x -y /tmp/clickgui.rar -o/tmp/clickgui-extract >/dev/null
          test -d /tmp/clickgui-extract/clickgui
          mkdir -p src/main/java/kronex/fun/display/screens/clickgui
          cp -a /tmp/clickgui-extract/clickgui/. src/main/java/kronex/fun/display/screens/clickgui/
          rm -rf .clickgui-port

      - name: Commit imported sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/kronex/fun/display/screens/clickgui .clickgui-port
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import complete ClickGUI archive [skip ci]"
          git push origin HEAD:port/minecraft-1.21.4
